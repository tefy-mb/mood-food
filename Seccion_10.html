<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Búsqueda de Recetas</title>
</head>
<body>
    <h1>Buscar Recetas</h1>
    <form>
        <label for="ingrediente">Buscar por ingrediente:</label><br>
        <input type="text" id="ingrediente" name="ingrediente" placeholder="Ejemplo: tomate, pollo"><br><br>
        <label for="tiempo">Tiempo máximo de preparación:</label><br>
        <select id="tiempo" name="tiempo">
            <option value="">-- Selecciona --</option>
            <option value="15">15 minutos</option>
            <option value="30">30 minutos</option>
            <option value="45">45 minutos</option>
            <option value="60">1 hora</option>
        </select><br><br>

        <button type="submit">Buscar</button>
    </form>
 <hr>

    </footer>
</body>
</html>
